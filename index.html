<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23f83800' d='M1 1h2v1h2V1h2v3H6v1H5v1H3V5H2V4H1z'/%3E%3C/svg%3E" />
  <!--@head-->
  <script>document.documentElement.classList.add('js');</script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div id="stage" class="stage" aria-hidden="true"></div>

  <header class="hud" id="hud">
    <nav class="hud-nav" aria-label="Sections">
      <a class="hud-logo" href="#top">RYAN.DEV</a>
      <details class="hud-map">
        <summary>MAP</summary>
        <ul>
          <li><a href="#top">Title</a></li>
          <li><a href="#about">1-1 About</a></li>
          <li><a href="#skills">2-1 Skills</a></li>
          <li><a href="#experience">3-1 Experience</a></li>
          <li><a href="#projects">3-2 Projects</a></li>
          <li><a href="#contact">Boss: Contact</a></li>
        </ul>
      </details>
    </nav>
    <div class="hud-stats" aria-hidden="true">
      <div class="hud-cell"><span class="lbl">LV</span><b id="hud-lv">1</b></div>
      <div class="hud-cell"><span class="lbl">HP</span><span class="bar bar-hp"><i></i></span></div>
      <div class="hud-cell"><span class="lbl">XP</span><span class="bar bar-xp"><i id="hud-xpfill"></i></span><b id="hud-xp">0</b></div>
      <div class="hud-cell"><span class="lbl">KO</span><b id="hud-kills">0/0</b></div>
      <div class="hud-cell hud-zone" id="hud-zone">TITLE SCREEN</div>
    </div>
    <button id="mute" class="hud-btn" type="button" aria-pressed="false">
      <span aria-hidden="true">♪</span> <span id="mute-label">SOUND OFF</span>
    </button>
  </header>

  <div id="toast" class="toast" aria-hidden="true"></div>
  <div id="levelup" class="levelup" role="status" aria-live="polite"></div>

  <!--@body-->
</body>
</html>
